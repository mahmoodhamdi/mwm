<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Code brackets with circuit lines -->
  <g transform="translate(0, 5)">
    <!-- Left bracket -->
    <path d="M18 8L8 25L18 42" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right bracket -->
    <path d="M42 8L52 25L42 42" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Center dot / node -->
    <circle cx="30" cy="25" r="4" fill="url(#grad)"/>
    <!-- Circuit lines -->
    <line x1="22" y1="25" x2="26" y2="25" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="25" x2="38" y2="25" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="17" x2="30" y2="21" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="29" x2="30" y2="33" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <!-- Small corner nodes -->
    <circle cx="18" cy="8" r="2" fill="#38bdf8"/>
    <circle cx="18" cy="42" r="2" fill="#38bdf8"/>
    <circle cx="42" cy="8" r="2" fill="#38bdf8"/>
    <circle cx="42" cy="42" r="2" fill="#38bdf8"/>
  </g>
  <!-- Text: MWM -->
  <text x="68" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="2">
    <tspan fill="url(#grad)">M</tspan><tspan fill="#f1f5f9">W</tspan><tspan fill="url(#grad)">M</tspan>
  </text>
  <!-- Tagline -->
  <text x="68" y="55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="500" fill="#94a3b8" letter-spacing="3">
    SOFTWARE SOLUTIONS
  </text>
</svg>
